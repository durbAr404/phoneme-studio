# The API runs on Render's free plan, which sleeps after 15 minutes without traffic.
# This pings it every 10 minutes so visitors rarely wait for it to wake up.
# Set the repository variable API_HEALTH_URL (e.g. https://your-api.onrender.com/health).
# Free for public repos. For a private repo, use a free cron service instead (see docs/DEPLOYMENT.md).
name: Keep API awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: ${{ vars.API_HEALTH_URL != '' }}
    steps:
      - name: Ping the API
        run: curl --silent --show-error --max-time 90 --retry 2 --retry-delay 10 "${{ vars.API_HEALTH_URL }}"
