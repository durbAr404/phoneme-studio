version: 2
updates:
  - { package-ecosystem: pip, directory: /apps/api, schedule: { interval: weekly } }
  - { package-ecosystem: npm, directory: /apps/web, schedule: { interval: weekly }, groups: { minor: { update-types: [minor, patch] } } }
  - { package-ecosystem: github-actions, directory: /, schedule: { interval: monthly } }
